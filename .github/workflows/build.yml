name: Build apps

# Run it from the Actions tab ("Run workflow"), or automatically when you push a tag like v1.5
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the game folder (www or docs)
        shell: bash
        run: |
          if [ -d www ] && [ ! -d docs ]; then cp -r www docs; fi
          if [ -d docs ] && [ ! -d www ]; then cp -r docs www; fi
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the game folder (www or docs)
        shell: bash
        run: |
          if [ -d www ] && [ ! -d docs ]; then cp -r www docs; fi
          if [ -d docs ] && [ ! -d www ]; then cp -r docs www; fi
      - run: npm install
      - run: npx cap add android
      - run: node scripts/android-permissions.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TableDrummer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: TableDrummer.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.4' }}
          name: Table Drummer ${{ github.ref_type == 'tag' && github.ref_name || 'v1.4' }}
          body: |
            **Windows:** download the "Setup" .exe to install, or the other .exe to run without installing.
            **Android:** download TableDrummer.apk on your phone and open it (allow "Install unknown apps" when asked).
            **Play in the browser:** https://shakirpyjv.github.io/table-drummer/
          files: |
            out/windows/*.exe
            out/android/*.apk
